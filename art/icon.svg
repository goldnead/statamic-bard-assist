<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#3730A3"/>
    </linearGradient>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Two lines of plain text above a dashed block: the dashed outline is how
       the live preview draws a suggestion before anyone accepts it, and the
       four-point star is the "From your text" pill a set carries afterwards.
       Both are things the editor actually sees, not a generic "AI" sparkle
       standing alone. -->
  <rect x="104" y="112" width="190" height="30" rx="15" fill="#FFFFFF"/>
  <rect x="104" y="170" width="136" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.75"/>

  <rect x="104" y="244" width="304" height="164" rx="30" fill="#FFFFFF" fill-opacity="0.14"
        stroke="#FFFFFF" stroke-width="14" stroke-dasharray="36 22" stroke-linecap="round"/>
  <rect x="144" y="292" width="156" height="26" rx="13" fill="#FFFFFF"/>
  <rect x="144" y="340" width="104" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.75"/>

  <!-- the star -->
  <path d="M392 72 C400 124 416 140 468 148 C416 156 400 172 392 224 C384 172 368 156 316 148 C368 140 384 124 392 72 Z" fill="#FFFFFF"/>
</svg>
