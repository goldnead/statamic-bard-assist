name: Bug report
description: Something in Bard Assist does not work as the README says.
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The Bard field's configuration (YAML) and the text you typed help most. Do not paste API keys.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Output of `php please support:details`
      render: text
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      options: [typesafe, vercel]
    validations:
      required: true
